openapi: "3.0.3"

info:
  title: Smarthome API
  version: "1.0"
  description: |
    API шлюза. Авторизация - Bearer в заголовке Authorization, кроме методов auth.
    Чужие объекты отдаются как 404, чтобы не подтверждать их существование.
    Списки - limit/offset, показания и команды - курсор.

security:
  - bearerAuth: []

paths:
  /api/v1/auth/code:
    post:
      tags:
        - auth
      summary: Запросить код подтверждения на email
      description: Отвечает 202 всегда, чтобы по нему нельзя было проверить наличие пользователя
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCodeRequest"
            example:
              email: "mail@example.com"
              purpose: "signup"
      responses:
        "202":
          description: Запрос принят
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/signup:
    post:
      tags:
        - auth
      summary: Регистрация пользователя
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
            example:
              email: "mail@example.com"
              password: "SuperSecret123"
              code: "483920"
              first_name: "Артем"
              last_name: "Бакулев"
      responses:
        "201":
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email уже занят
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: "email_already_registered"
        "422":
          description: Неверный или истекший код подтверждения
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: "invalid_confirmation_code"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/signin:
    post:
      tags:
        - auth
      summary: Вход пользователя
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SigninRequest"
            example:
              email: "mail@example.com"
              password: "SuperSecret123"
      responses:
        "200":
          description: Успешная авторизация
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Неверные логин/пароль
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: "invalid_credentials"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/refresh:
    post:
      tags:
        - auth
      summary: Обновить пару токенов
      description: Старый refresh-токен отзывается, повторное использование даст 401
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Новая пара токенов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Токен недействителен, отозван или истек
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: "invalid_refresh_token"

  /api/v1/auth/signout:
    post:
      tags:
        - auth
      summary: Выход пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Сессия закрыта
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/password:
    post:
      tags:
        - auth
      summary: Новый пароль по коду подтверждения
      description: Все активные сессии пользователя отзываются
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
            example:
              email: "mail@example.com"
              code: "483920"
              new_password: "EvenMoreSecret456"
      responses:
        "204":
          description: Пароль изменен
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          description: Неверный или истекший код подтверждения
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: "invalid_confirmation_code"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/users/me:
    get:
      tags:
        - users
      summary: Профиль текущего пользователя
      responses:
        "200":
          description: Данные пользователя
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/sensor_models:
    get:
      tags:
        - catalog
      summary: Список доступных моделей датчиков с их производителями
      parameters:
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/SensorType"
        - name: manufacturer_id
          in: query
          schema:
            type: integer
            format: int64
        - name: query
          in: query
          description: Поиск по названию модели и производителя
          schema:
            type: string
            maxLength: 100
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Страница моделей
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - pagination
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SensorModel"
                  pagination:
                    $ref: "#/components/schemas/OffsetPagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/places:
    get:
      tags:
        - places
      summary: Список мест пользователя
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Страница мест
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - pagination
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Place"
                  pagination:
                    $ref: "#/components/schemas/OffsetPagination"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags:
        - places
      summary: Создать место
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceWriteRequest"
            example:
              name: "Дача"
              coords:
                latitude: 55.751244
                longitude: 37.618423
      responses:
        "201":
          description: Место создано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Place"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/places/{place_id}:
    parameters:
      - $ref: "#/components/parameters/PlaceId"
    get:
      tags:
        - places
      summary: Получить место
      responses:
        "200":
          description: Место
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Place"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags:
        - places
      summary: Изменить место
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceWriteRequest"
      responses:
        "200":
          description: Место изменено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Place"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

    delete:
      tags:
        - places
      summary: Удалить место
      description: Soft-delete, недоступно пока в комнатах есть датчики
      responses:
        "204":
          description: Место удалено
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: В месте остались размещенные датчики
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: "place_not_empty"

  /api/v1/rooms:
    get:
      tags:
        - places
      summary: Список комнат пользователя
      parameters:
        - name: place_id
          in: query
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Страница комнат
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - pagination
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Room"
                  pagination:
                    $ref: "#/components/schemas/OffsetPagination"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags:
        - places
      summary: Создать комнату
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomCreateRequest"
            example:
              place_id: 7
              name: "Гостиная"
      responses:
        "201":
          description: Комната создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Место не найдено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/rooms/{room_id}:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      tags:
        - places
      summary: Получить комнату
      responses:
        "200":
          description: Комната
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags:
        - places
      summary: Переименовать комнату
      description: Перенос в другое место не поддерживается
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomUpdateRequest"
      responses:
        "200":
          description: Комната изменена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

    delete:
      tags:
        - places
      summary: Удалить комнату
      responses:
        "204":
          description: Комната удалена
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: В комнате остались размещенные датчики
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: "room_not_empty"

  /api/v1/sensors:
    get:
      tags:
        - sensors
      summary: Список датчиков пользователя
      parameters:
        - name: place_id
          in: query
          schema:
            type: integer
            format: int64
        - name: room_id
          in: query
          schema:
            type: integer
            format: int64
        - name: model_id
          in: query
          schema:
            type: integer
            format: int64
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/SensorType"
        - name: unplaced
          in: query
          description: Только датчики без комнаты
          schema:
            type: boolean
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Страница датчиков
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - pagination
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Sensor"
                  pagination:
                    $ref: "#/components/schemas/OffsetPagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

    post:
      tags:
        - sensors
      summary: Регистрация датчика
      description: Учетные данные для MQTT возвращаются только здесь, в базе лежит хеш токена
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SensorCreateRequest"
            example:
              model_id: 12
              verbose_name: "Датчик в гостиной"
              room_id: 3
      responses:
        "201":
          description: Датчик зарегистрирован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SensorCreatedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Модель или комната не найдены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/sensors/{sensor_id}:
    parameters:
      - $ref: "#/components/parameters/SensorId"
    get:
      tags:
        - sensors
      summary: Получить датчик
      responses:
        "200":
          description: Датчик
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sensor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags:
        - sensors
      summary: Изменить датчик
      description: room_id = null снимает датчик с размещения
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SensorUpdateRequest"
            example:
              verbose_name: "Датчик у окна"
              room_id: 4
      responses:
        "200":
          description: Датчик изменен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sensor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

    delete:
      tags:
        - sensors
      summary: Удалить датчик
      description: Soft-delete, MQTT-сессия разрывается сразу, показания чистит GC
      responses:
        "204":
          description: Датчик удален
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/sensors/{sensor_id}/metrics/{metric_code}:
    parameters:
      - $ref: "#/components/parameters/SensorId"
      - $ref: "#/components/parameters/MetricCode"
    get:
      tags:
        - measurements
      summary: Значения метрик за период с фильтрами
      description: Интервал [from, to), пагинация курсорная
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: По умолчанию текущий момент
          schema:
            type: string
            format: date-time
        - name: min_value
          in: query
          schema:
            type: number
            format: double
        - name: max_value
          in: query
          schema:
            type: number
            format: double
        - name: order
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Страница показаний
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - pagination
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/MetricPoint"
                  pagination:
                    $ref: "#/components/schemas/CursorPagination"
              example:
                items:
                  - measured_at: "2026-08-02T10:15:30.000Z"
                    value: 22.4
                    attributes:
                      quality: "good"
                  - measured_at: "2026-08-02T10:14:30.000Z"
                    value: 22.1
                    attributes: {}
                pagination:
                  next_cursor: "eyJtZWFzdXJlZF9hdCI6IjIwMjYtMDgtMDJUMTA6MTQ6MzBaIn0"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Датчик или метрика не найдены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/sensors/{sensor_id}/command_templates:
    parameters:
      - $ref: "#/components/parameters/SensorId"
    get:
      tags:
        - commands
      summary: Список доступных команд
      description: Шаблоны берутся от модели датчика, payload_schema - JSON Schema аргументов
      responses:
        "200":
          description: Шаблоны команд
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CommandTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/sensors/{sensor_id}/commands:
    parameters:
      - $ref: "#/components/parameters/SensorId"
    get:
      tags:
        - commands
      summary: Список отправленных команд
      parameters:
        - name: status
          in: query
          schema:
            type: array
            items:
              $ref: "#/components/schemas/CommandStatus"
          style: form
          explode: true
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Страница команд, от новых к старым
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - pagination
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Command"
                  pagination:
                    $ref: "#/components/schemas/CursorPagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

    post:
      tags:
        - commands
      summary: Отправка команды из шаблона
      description: |
        Команда принимается асинхронно, результат забирается опросом GET по id команды.
        Idempotency-Key защищает от дублей при ретраях.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandCreateRequest"
            example:
              template_code: "set_target_temperature"
              payload:
                target_temperature: 23.5
      responses:
        "202":
          description: Команда принята к исполнению
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Command"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Датчик не найден или его модель не поддерживает эту команду
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: "command_template_not_supported"
        "422":
          description: Аргументы не соответствуют схеме шаблона
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: "validation_error"
                message: "Некорректные аргументы команды"
                details:
                  - field: "payload.target_temperature"
                    message: "Допустимый диапазон от 5 до 35"
        "503":
          description: Сервис удаленного управления недоступен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: "remote_control_unavailable"

  /api/v1/sensors/{sensor_id}/commands/{command_id}:
    parameters:
      - $ref: "#/components/parameters/SensorId"
      - $ref: "#/components/parameters/CommandId"
    get:
      tags:
        - commands
      summary: Информация об одной команде
      responses:
        "200":
          description: Команда
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Command"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/sensors/{sensor_id}/commands/{command_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/SensorId"
      - $ref: "#/components/parameters/CommandId"
    post:
      tags:
        - commands
      summary: Отмена отправленной команды
      description: |
        Отменяется команда в статусе PENDING или PROCESSING, она переходит в CANCELLED.
        Запись остается в истории, метод меняет статус.
      responses:
        "200":
          description: Команда отменена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Command"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Команда уже завершена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: "command_already_finished"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0

    Cursor:
      name: cursor
      in: query
      description: Значение pagination.next_cursor из предыдущего ответа
      schema:
        type: string

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid

    PlaceId:
      name: place_id
      in: path
      required: true
      schema:
        type: integer
        format: int64

    RoomId:
      name: room_id
      in: path
      required: true
      schema:
        type: integer
        format: int64

    SensorId:
      name: sensor_id
      in: path
      required: true
      schema:
        type: integer
        format: int64

    MetricCode:
      name: metric_code
      in: path
      required: true
      description: Соответствует типу модели датчика
      schema:
        type: string
        maxLength: 64
        example: "temperature"

    CommandId:
      name: command_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Невалидный запрос
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: "bad_request"

    Unauthorized:
      description: Токен отсутствует или невалиден
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: "unauthorized"

    NotFound:
      description: Объект не найден
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: "not_found"

    ValidationError:
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: "validation_error"
            details:
              - field: "email"
                message: "Некорректный формат"

    TooManyRequests:
      description: Слишком много запросов
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: "too_many_requests"

  schemas:
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"

    ErrorDetail:
      type: object
      required:
        - message
      properties:
        field:
          type: string
        message:
          type: string

    OffsetPagination:
      type: object
      required:
        - limit
        - offset
        - total
      properties:
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer

    CursorPagination:
      type: object
      properties:
        next_cursor:
          type: string
          nullable: true

    Email:
      type: string
      format: email
      minLength: 3
      maxLength: 320
      example: "mail@example.com"

    Password:
      type: string
      format: password
      minLength: 8
      maxLength: 128
      example: "SuperSecret123"

    AuthCodePurpose:
      type: string
      enum:
        - signup
        - password_reset

    AuthCodeRequest:
      type: object
      required:
        - email
        - purpose
      properties:
        email:
          $ref: "#/components/schemas/Email"
        purpose:
          $ref: "#/components/schemas/AuthCodePurpose"

    SigninRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          $ref: "#/components/schemas/Password"

    SignupRequest:
      type: object
      required:
        - email
        - password
        - code
        - first_name
        - last_name
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          $ref: "#/components/schemas/Password"
        code:
          type: string
          minLength: 4
          maxLength: 16
          example: "483920"
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100

    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string

    PasswordResetRequest:
      type: object
      required:
        - email
        - code
        - new_password
      properties:
        email:
          $ref: "#/components/schemas/Email"
        code:
          type: string
          minLength: 4
          maxLength: 16
        new_password:
          $ref: "#/components/schemas/Password"

    TokenPairResponse:
      type: object
      required:
        - user_id
        - access_token
        - refresh_token
        - token_type
        - expires_in
      properties:
        user_id:
          type: integer
          format: int64
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum:
            - Bearer
        expires_in:
          type: integer
          description: Время жизни access-токена в секундах
          example: 900

    User:
      type: object
      required:
        - id
        - email
        - first_name
        - last_name
        - created_at
      properties:
        id:
          type: integer
          format: int64
        email:
          $ref: "#/components/schemas/Email"
        first_name:
          type: string
        last_name:
          type: string
        created_at:
          type: string
          format: date-time

    SensorType:
      type: string
      enum:
        - TEMPERATURE
        - HUMIDITY
        - CO2
        - MOTION

    Manufacturer:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: "Xiaomi"
        logo_url:
          type: string
          format: uri
          nullable: true

    SensorModel:
      type: object
      required:
        - id
        - code
        - name
        - type
        - manufacturer
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
          example: "xiaomi-th-2"
        name:
          type: string
          example: "Temperature and Humidity Monitor 2"
        type:
          $ref: "#/components/schemas/SensorType"
        manufacturer:
          $ref: "#/components/schemas/Manufacturer"

    Coordinates:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180

    Place:
      type: object
      required:
        - id
        - name
        - created_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: "Дача"
        coords:
          allOf:
            - $ref: "#/components/schemas/Coordinates"
          nullable: true
        rooms_count:
          type: integer
        created_at:
          type: string
          format: date-time

    PlaceWriteRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        coords:
          allOf:
            - $ref: "#/components/schemas/Coordinates"
          nullable: true

    Room:
      type: object
      required:
        - id
        - place_id
        - name
      properties:
        id:
          type: integer
          format: int64
        place_id:
          type: integer
          format: int64
        name:
          type: string
          example: "Гостиная"
        sensors_count:
          type: integer

    RoomCreateRequest:
      type: object
      required:
        - place_id
        - name
      properties:
        place_id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 100

    RoomUpdateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    Sensor:
      type: object
      required:
        - id
        - verbose_name
        - model
        - created_at
      properties:
        id:
          type: integer
          format: int64
        verbose_name:
          type: string
          example: "Датчик в гостиной"
        model:
          $ref: "#/components/schemas/SensorModel"
        room:
          allOf:
            - $ref: "#/components/schemas/Room"
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SensorCreateRequest:
      type: object
      required:
        - model_id
        - verbose_name
      properties:
        model_id:
          type: integer
          format: int64
        verbose_name:
          type: string
          minLength: 1
          maxLength: 100
        room_id:
          type: integer
          format: int64
          nullable: true

    SensorUpdateRequest:
      type: object
      minProperties: 1
      properties:
        verbose_name:
          type: string
          minLength: 1
          maxLength: 100
        room_id:
          type: integer
          format: int64
          nullable: true

    SensorCreatedResponse:
      allOf:
        - $ref: "#/components/schemas/Sensor"
        - type: object
          required:
            - mqtt_credentials
          properties:
            mqtt_credentials:
              $ref: "#/components/schemas/MqttCredentials"

    MqttCredentials:
      type: object
      required:
        - client_id
        - token
        - broker_url
      properties:
        client_id:
          type: string
          example: "sensor-1042"
        token:
          type: string
        broker_url:
          type: string
          format: uri
          example: "mqtts://mqtt.warmhouse.local:8883"

    MetricPoint:
      type: object
      required:
        - measured_at
        - value
      properties:
        measured_at:
          type: string
          format: date-time
        value:
          type: number
          format: double
        attributes:
          type: object
          additionalProperties:
            type: string

    CommandStatus:
      type: string
      enum:
        - PENDING
        - PROCESSING
        - DONE
        - CANCELLED
        - FAILED

    CommandTemplate:
      type: object
      required:
        - id
        - code
        - name
        - payload_schema
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
          example: "set_target_temperature"
        name:
          type: string
          example: "Установить целевую температуру"
        description:
          type: string
        payload_schema:
          type: object
          additionalProperties: true
          example:
            type: object
            required:
              - target_temperature
            properties:
              target_temperature:
                type: number
                minimum: 5
                maximum: 35

    CommandCreateRequest:
      type: object
      required:
        - template_code
      properties:
        template_code:
          type: string
          example: "set_target_temperature"
        payload:
          type: object
          additionalProperties: true

    Command:
      type: object
      required:
        - id
        - sensor_id
        - template_code
        - status
        - created_at
        - expires_at
      properties:
        id:
          type: string
          format: uuid
        sensor_id:
          type: integer
          format: int64
        template_code:
          type: string
        status:
          $ref: "#/components/schemas/CommandStatus"
        payload:
          type: object
          additionalProperties: true
        error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: После этого момента неподтвержденная команда уходит в FAILED
        finished_at:
          type: string
          format: date-time
          nullable: true
